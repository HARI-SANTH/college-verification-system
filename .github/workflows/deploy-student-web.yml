name: Deploy Student Web App to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/deploy-student-web.yml'
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Flutter Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Dart Versions
        run: flutter --version

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Compile Flutter Web Release
        working-directory: ./mobile
        run: flutter build web --release --base-href "/college-verification-system/"

      - name: Configure GitHub Pages Single-Page Fallback (404.html)
        working-directory: ./mobile/build/web
        run: cp index.html 404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mobile/build/web

  deploy:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages Site
        id: deployment
        uses: actions/deploy-pages@v4
