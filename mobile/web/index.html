<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Baselios Poulose II Catholicose College - Student Admissions & Verification Portal">

  <!-- Aggressive Cache-Busting HTTP Headers: Prevents browsers from caching stale HTML shells -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="college_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BPC College - Student Verification Portal</title>
  <link rel="manifest" href="manifest.json">

  <!-- Automatic Stale Service Worker & Cache Killer -->
  <script>
    (function() {
      // 1. Unregister all existing service workers to destroy old cached main.dart.js
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister().then(function(success) {
              console.log('[CacheBuster] Unregistered legacy service worker:', success);
            });
          }
        });
      }
      // 2. Wipe browser CacheStorage API caches (flutter-app-cache, canvaskit, etc.)
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var j = 0; j < names.length; j++) {
            caches.delete(names[j]).then(function(success) {
              console.log('[CacheBuster] Purged stale cache storage:', success);
            });
          }
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Dynamically inject flutter_bootstrap.js with timestamp query parameter to bypass HTTP cache -->
  <script>
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + Date.now();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
